name: Healthcare research suite

on:
  push:
    paths: ["research-suite/**", "modules/rx-utilization/**", "examples/research-cases/**", "skills/model-valuation/references/case-*.md", "skills/model-valuation/references/case-sources.json", "scripts/validate_repository.py", "README.md", ".github/workflows/research-suite.yml"]
  pull_request:
    paths: ["research-suite/**", "modules/rx-utilization/**", "examples/research-cases/**", "skills/model-valuation/references/case-*.md", "skills/model-valuation/references/case-sources.json", "scripts/validate_repository.py", "README.md", ".github/workflows/research-suite.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: research-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev,mcp]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_demo.py
      - run: python scripts/validate_package.py
      - run: python scripts/evaluate_reliability.py
      - run: python ../scripts/validate_repository.py
      - run: python -m unittest discover -s ../modules/rx-utilization/tests -v

  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python scripts/live_smoke.py --out outputs/live-validation.json
